services:
  - type: web
    name: django-rag
    env: python
    rootDir: django_chat

    # Only install deps and collect static at build time.
    # Migrations run at START time (via safe_migrate) so they always use
    # the live DATABASE_URL and can auto-repair broken migration state.
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput

    # safe_migrate checks for missing chat tables, repairs stale migration
    # records if needed, then runs migrate before starting Daphne.
    startCommand: >
      python manage.py safe_migrate &&
      daphne -b 0.0.0.0 -p $PORT django_chat.asgi:application

    # Render uses this endpoint to confirm the service is healthy
    # /health/ returns a plain 200 OK immediately without any DB/Redis queries
    healthCheckPath: /health/